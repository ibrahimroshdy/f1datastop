<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>F1 DataStop Embeddable Components Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f5f5f5;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .embed-container {
      margin-bottom: 30px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 30px;
      margin-bottom: 15px;
      color: #333;
    }
    p {
      color: #666;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>F1 DataStop Embeddable Components Test</h1>
    
    <h2>Driver Standings - Light Theme (Roboto font)</h2>
    <p>Clean table-only design with light theme and Roboto font:</p>
    <div class="embed-container">
      <iframe 
        src="http://localhost:8080/embed/driver-standings?season=2023&theme=light&font=Roboto" 
        width="100%" 
        height="500px" 
        frameborder="0">
      </iframe>
    </div>
    
    <h2>Constructor Standings - Dark Theme (Inter font)</h2>
    <p>Clean table-only design with dark theme and Inter font:</p>
    <div class="embed-container">
      <iframe 
        src="http://localhost:8080/embed/constructor-standings?season=2019&theme=dark&font=Inter" 
        width="100%" 
        height="400px" 
        frameborder="0">
      </iframe>
    </div>
  </div>
</body>
</html>
