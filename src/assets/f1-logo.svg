<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="white" />
  
  <!-- F1 Wing Shape -->
  <path d="M 30 120 Q 60 80, 120 80 L 160 80 Q 180 80, 180 100 L 180 120 L 30 120 Z" fill="black" stroke="red" stroke-width="3" />
  
  <!-- Lower Section -->
  <path d="M 30 120 L 180 120 L 180 140 Q 160 160, 30 160 Z" fill="red" />

  <!-- Wing Stripes -->
  <line x1="45" y1="120" x2="45" y2="160" stroke="white" stroke-width="4" />
  <line x1="70" y1="120" x2="70" y2="160" stroke="white" stroke-width="4" />
  <line x1="95" y1="120" x2="95" y2="160" stroke="white" stroke-width="4" />

  <!-- Text -->
  <text x="50" y="50" font-family="Arial" font-size="24" fill="black">F1 Wing</text>
</svg>
