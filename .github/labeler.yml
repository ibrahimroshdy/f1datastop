# Labels pull requests by the files they change (actions/labeler v5 format).
# With sync-labels: true, a label is removed again when its files are no longer changed.

# Frontend
"area: frontend":
  - changed-files:
      - any-glob-to-any-file:
          - "web/src/**"
          - "web/public/**"
          - "web/package.json"
          - "web/tsconfig*.json"
          - "web/vite.config.ts"
          - "web/tailwind.config.*"

# API / Edge Functions / Supabase
"area: api":
  - changed-files:
      - any-glob-to-any-file: "supabase/**"

# Data Ingestion / Analysis
"area: ingestion":
  - changed-files:
      - any-glob-to-any-file: "analysis/**"

# Infrastructure / CI / Deploy
"area: infra":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - "vercel.json"
          - "Dockerfile*"
          - "docker-compose*"

# Documentation
"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "README.md"
          - "CONTRIBUTING.md"
          - "CHANGELOG.md"
          - "CODE_OF_CONDUCT.md"
          - "docs/**"
          - ".github/ISSUE_TEMPLATE/**"
          - ".github/pull_request_template.md"

# Dependencies
dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "web/package.json"
          - "web/package-lock.json"
          - "analysis/requirements.txt"
