name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Describe the problem and proposed solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve? Who benefits?
      placeholder: "As a race analyst, I want to compare sector times across drivers..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work? UI, API, data changes?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches you've thought of
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard / Standings
        - Race Analysis / Charts
        - Calendar / Sessions
        - Drivers / Teams
        - Embeddable Widgets
        - API / f1-proxy
        - Data Ingestion / CircleCI
        - Developer Experience
        - Other
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: Frontend (web/)
        - label: Analysis / Ingestion (analysis/)
        - label: Supabase / Edge Functions (supabase/)
        - label: CI / Deploy (CircleCI, Vercel)
        - label: Documentation