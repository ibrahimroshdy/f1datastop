name: Bug Report
description: Report a reproducible bug
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the details below.
  - type: input
    id: version
    attributes:
      label: Version / Commit
      description: What version or commit are you on? (e.g., v1.0.0 or `b6cef6e`)
      placeholder: v1.0.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Clear, minimal steps to reproduce the bug
      placeholder: |
        1. Go to /race-analysis
        2. Select 2026 Round 1
        3. Click "Compare Drivers"
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens? (error message, screenshot, console output)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard / Standings
        - Race Analysis / Charts
        - Calendar / Sessions
        - Drivers / Teams
        - Embeddable Widgets
        - API / f1-proxy
        - Data Ingestion / CircleCI
        - Deploy / Vercel
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Browser, OS, Supabase project status, anything else relevant