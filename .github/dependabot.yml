version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "area: frontend"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps): "

  - package-ecosystem: "pip"
    directory: "/analysis"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "area: ingestion"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps): "