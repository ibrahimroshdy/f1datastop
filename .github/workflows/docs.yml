name: Docs site

# Static docs site → GitHub Pages. Path-filtered to docs/** so it never
# fights pr-ci.yml (which owns CI only; data jobs live in pipeline.yml/queue.yml).
# No build step: plain HTML. Only html, css, CNAME and assets/ are staged and published.
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Stage the site
        run: |
          test -f docs/CNAME || { echo "CNAME missing"; exit 1; }
          test -f docs/index.html || { echo "index.html missing"; exit 1; }
          # Publish only the site files, never the rest of docs/.
          mkdir -p _site
          cp docs/*.html docs/styles.css docs/CNAME _site/
          cp -R docs/assets _site/assets
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
