name: Docs site

# Static docs site (Astro + Starlight) → GitHub Pages. Path-filtered to docs/** so it never
# fights pr-ci.yml (which owns CI only; data jobs live in pipeline.yml/queue.yml).
# Build and check: `npm --prefix docs run check`. The published folder is docs/dist.
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build and publish are separate jobs, as GitHub's Pages starter does: the publish job waits
  # for the build to finish, which gives the uploaded site time to register. In one job, publish
  # once ran a second after the upload and found no artifact (run 42927211056, 2026-11-10).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm --prefix docs ci
      - run: npm --prefix docs run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
