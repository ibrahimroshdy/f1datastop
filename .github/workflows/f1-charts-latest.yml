name: F1 latest-race charts

# Deep Dive charts/posters for the current weekend. Covers EVERY session type (FP1/2/3,
# Q, sprint, race) for the current round + the next — not just the race — so a session's
# charts appear soon after it runs, in both themes. Each generate call self-skips a
# session that has no data yet, exiting 0, so a non-zero exit is a real error.
#
# Cadence: every 4h across Fri–Sun (was 2h — trimmed 2026-08-13 to cut Actions minutes;
# this is the biggest minute consumer because each run re-renders every session for the
# round + next, taking the better part of an hour). The interval must comfortably exceed
# the run, or cancel-in-progress kills each run before it finishes and nothing is produced;
# 4h clears ~45-min runs with margin and still catches a session within ~4h of the flag.
# REAL FIX (bigger win than the cron): give generate.py a skip-if-exists so each run only
# renders NEW session charts (~minutes instead of ~an hour) — then the cadence can tighten.
on:
  schedule:
    - cron: "0 */4 * * 5,6,0"
  workflow_dispatch: {}

concurrency:
  group: f1-charts
  cancel-in-progress: true

jobs:
  charts:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Livetiming CDN 403s Azure ranges (all GitHub runners); route via allow-listed proxy.
      F1_LIVETIMING_PROXY: ${{ secrets.F1_LIVETIMING_PROXY }}
      FASTF1_CACHE: ${{ github.workspace }}/analysis/.fastf1cache
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/f1-setup

      - name: Fail fast if Supabase creds are missing
        run: |
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY are empty — set them in repo secrets."
            exit 1
          fi

      - name: Session charts (all sessions, current round + next) + teammate compares
        working-directory: analysis
        # TEAMMATE_PAIRS are the current-season lineups (mirror modal_app.py); update per season.
        run: |
          set -u
          Y="$(date -u +%Y)"
          runs=0; fails=0
          # Run a generate call, counting outcomes. generate.py exits 0 when a session has
          # no data yet (prints "0 charts"), so a non-zero exit == a real error, not a skip.
          try() {
            runs=$((runs + 1))
            if ! "$@"; then
              fails=$((fails + 1))
              echo "::warning::FAILED: $*"
            fi
          }

          # Current round + next, exactly like f1-assets: latest_completed_round() is the
          # last round whose RACE is done, so during a live weekend R is last week and R+1
          # is the weekend running now (its FP/Q charts are the ones people want live).
          R="$(python -c "import backfill as bf; print(bf.latest_completed_round($Y) or 0)")"
          ROUNDS=""
          [ "$R" -ge 1 ] && ROUNDS="$R"
          ROUNDS="$ROUNDS $((R + 1))"
          echo "latest completed round: $R  ->  processing rounds:$ROUNDS"

          # Every session type — the point of this change: practice/quali charts, not just
          # the race. Each self-skips a session a weekend doesn't have or hasn't run.
          SESSIONS="FP1 FP2 FP3 Q SQ SS S R"
          for sess in $SESSIONS; do
            echo "== charts $sess =="
            for r in $ROUNDS; do
              try python generate.py --season "$Y" --round "$r" --session "$sess" --format all --theme all
            done
          done

          # Teammate head-to-heads (race only) — best-effort; a pair may be absent from a round.
          for pair in "RUS,ANT" "NOR,PIA" "LEC,HAM"; do
            for r in $ROUNDS; do
              try python generate.py --season "$Y" --round "$r" --session R --only driver_compare --drivers "$pair" --format all --theme all
            done
          done

          ok=$((runs - fails))
          {
            echo "### F1 weekend charts — ${Y}"
            echo ""
            echo "| generate calls | ok | failed |"
            echo "|---------------:|---:|-------:|"
            echo "| $runs | $ok | $fails |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "calls=$runs ok=$ok failed=$fails"
          if [ "$runs" -gt 0 ] && [ "$fails" -eq "$runs" ]; then
            echo "::error::every one of the $runs generate calls failed — broken run, not a no-op."
            exit 1
          fi
          if [ "$fails" -gt 0 ]; then
            echo "::warning::$fails of $runs generate calls failed (see warnings above)."
          fi
