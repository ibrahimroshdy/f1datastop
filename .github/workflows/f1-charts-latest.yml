name: F1 latest-race charts

# Deep Dive charts for the current weekend, in both themes. Landscape master + thumbnail
# only — social sizes render on demand (f1-chart-request.yml).
#
# Cost control: a stdlib gate (analysis/charts_todo.py) runs BEFORE the Python/FastF1
# setup and lists only the sessions that have finished and have no published charts. If
# the list is empty the job ends in seconds. Previously every tick loaded 16 sessions
# through FastF1 (~45 min) regardless — ~5,000 Actions minutes in August. Idle ticks now
# cost ~10 s, so the cron can be 2-hourly and charts land within ~2 h of a session.
on:
  schedule:
    - cron: "0 */2 * * 5,6,0"
  workflow_dispatch:
    inputs:
      force:
        description: "re-render every session of the window even if charts exist"
        type: boolean
        default: false

concurrency:
  group: f1-charts
  cancel-in-progress: false   # never kill a render mid-upload; the next tick just no-ops

jobs:
  charts:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Cloudflare R2 — all chart/telemetry/replay/circuit blobs (analysis/blob_store.py)
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      BLOB_PUBLIC_BASE: ${{ secrets.BLOB_PUBLIC_BASE }}
      # Livetiming CDN 403s Azure ranges (all GitHub runners); route via allow-listed proxy.
      F1_LIVETIMING_PROXY: ${{ secrets.F1_LIVETIMING_PROXY }}
      FASTF1_CACHE: ${{ github.workspace }}/analysis/.fastf1cache
    steps:
      - uses: actions/checkout@v4

      - name: Fail fast if creds are missing
        run: |
          for v in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY BLOB_PUBLIC_BASE; do
            if [ -z "${!v:-}" ]; then echo "::error::$v is empty — set it in repo secrets."; exit 1; fi
          done

      # ── Gate: which sessions actually need charts? (stdlib, before any pip install) ──
      - name: Which sessions need charts?
        id: gate
        working-directory: analysis
        run: |
          Y="$(date -u +%Y)"
          if [ "${{ inputs.force }}" = "true" ]; then
            # force = every finished session in the window, ignoring existing charts
            python3 charts_todo.py --season "$Y" --window-days 7 --grace-hours 3 > todo.txt || true
            python3 - "$Y" >> todo.txt <<'PY'
          import os, sys, json, urllib.request, urllib.parse
          from datetime import datetime, timedelta, timezone
          y=sys.argv[1]; url=os.environ["SUPABASE_URL"].rstrip("/"); key=os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          since=(datetime.now(timezone.utc)-timedelta(days=7)).isoformat()
          q=urllib.parse.urlencode({"select":"round,session_type,date_start","season":f"eq.{y}","date_start":f"gte.{since}","limit":"200"})
          req=urllib.request.Request(f"{url}/rest/v1/f1_session?{q}",headers={"apikey":key,"Authorization":f"Bearer {key}"})
          now=datetime.now(timezone.utc)
          for s in json.load(urllib.request.urlopen(req,timeout=30)):
              st=datetime.fromisoformat(s["date_start"].replace("Z","+00:00"))
              if s["session_type"] in ("FP1","FP2","FP3","Q","SQ","SS","S","R") and now>=st+timedelta(hours=3):
                  print(s["round"], s["session_type"])
          PY
            sort -u -o todo.txt todo.txt
          else
            python3 charts_todo.py --season "$Y" > todo.txt
          fi
          echo "season=$Y" >> "$GITHUB_OUTPUT"
          if [ -s todo.txt ]; then
            echo "has_work=true" >> "$GITHUB_OUTPUT"
            echo "Sessions needing charts:"; cat todo.txt
          else
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to render — every finished session already has charts. Exiting."
          fi

      - uses: ./.github/actions/f1-setup
        if: steps.gate.outputs.has_work == 'true'

      - name: Render charts for the sessions that need them
        if: steps.gate.outputs.has_work == 'true'
        working-directory: analysis
        # TEAMMATE_PAIRS are the current-season lineups (mirror modal_app.py); update per season.
        run: |
          set -u
          Y="${{ steps.gate.outputs.season }}"
          runs=0; fails=0
          try() { runs=$((runs + 1)); if ! "$@"; then fails=$((fails + 1)); echo "::warning::FAILED: $*"; fi; }

          # Landscape master + thumbnail, both themes. Social sizes are on demand.
          while read -r r sess; do
            [ -n "$r" ] || continue
            echo "== charts R$r $sess =="
            try python generate.py --season "$Y" --round "$r" --session "$sess" --format landscape --theme all --skip-existing
          done < todo.txt

          # Teammate head-to-heads only when a race session was just rendered.
          for r in $(awk '$2=="R"{print $1}' todo.txt | sort -u); do
            for pair in "RUS,ANT" "NOR,PIA" "LEC,HAM"; do
              try python generate.py --season "$Y" --round "$r" --session R --only driver_compare --drivers "$pair" --format landscape --theme all --skip-existing
            done
          done

          ok=$((runs - fails))
          { echo "### F1 weekend charts — ${Y}"; echo ""; echo "| generate calls | ok | failed |"; echo "|---:|---:|---:|"; echo "| $runs | $ok | $fails |"; } >> "$GITHUB_STEP_SUMMARY"
          echo "calls=$runs ok=$ok failed=$fails"
          if [ "$runs" -gt 0 ] && [ "$fails" -eq "$runs" ]; then echo "::error::every generate call failed — broken run, not a no-op."; exit 1; fi
          [ "$fails" -gt 0 ] && echo "::warning::$fails of $runs generate calls failed."
          exit 0

      - name: Refresh CDN indexes (charts / telemetry / replays / circuits)
        if: ${{ !cancelled() }}
        working-directory: analysis
        run: python index_export.py --season "$(date -u +%Y)"

      - name: Alert Slack on failure
        if: failure()
        uses: ./.github/actions/slack-alert
        with:
          webhook: ${{ secrets.SLACK_ALERTS_WEBHOOK }}
