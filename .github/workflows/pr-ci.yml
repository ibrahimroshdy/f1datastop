name: PR CI

# Fork-safe: web + docs + python-smoke run with zero credentials on PRs and pushes.
# Scheduled data jobs live in pipeline.yml (Pipeline) and queue.yml (Queue).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Title edits get their own group so they never cancel a running CI job on the same PR.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' && 'title' || 'ci' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    # Conventional PR titles drive the automatic version (see release.yml). PR-only, no secrets.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|chore|ci|test|build|style|revert)(\([^)]+\))?!?: .+'
          if ! printf '%s' "$PR_TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(web): add X' or 'fix!: Y'."
            echo "Got: $PR_TITLE"
            exit 1
          fi

  web:
    # `edited` (title/body edits) only matters to pr-title; skip the heavy jobs for it.
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  docs:
    # Fails the pull request if the docs site no longer builds or the built files are wrong.
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm --prefix docs ci
      - run: npm --prefix docs run check

  python-smoke:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - run: pip install -q -r analysis/requirements.txt
      - run: python -m compileall -q -x '(venv|\.fastf1cache|__pycache__)' analysis
      - name: Unit tests
        working-directory: analysis
        run: python -m unittest discover -s tests
      - name: Workflow schedule check
        run: |
          python .github/scripts/check_schedules.py
