name: Deep Dive chart request

# Fired by a Supabase DB webhook (repository_dispatch) when a row is inserted into
# f1_chart_requests, so a custom chart is generated per request. workflow_dispatch lets
# you drain the queue manually. Replaces Modal's process_chart_requests minute-cron.
on:
  repository_dispatch:
    types: [chart_request]
  workflow_dispatch: {}

concurrency:
  group: f1-chart-requests
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Cloudflare R2 — all chart/telemetry/replay/circuit blobs (analysis/blob_store.py)
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      BLOB_PUBLIC_BASE: ${{ secrets.BLOB_PUBLIC_BASE }}
      # Livetiming CDN 403s Azure ranges (all GitHub runners); route via allow-listed proxy.
      F1_LIVETIMING_PROXY: ${{ secrets.F1_LIVETIMING_PROXY }}
      FASTF1_CACHE: ${{ github.workspace }}/analysis/.fastf1cache
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/f1-setup
      - name: Drain pending chart requests
        working-directory: analysis
        run: python process_chart_requests.py

      - name: Refresh CDN indexes (charts / telemetry / replays / circuits)
        if: ${{ !cancelled() }}
        working-directory: analysis
        run: python index_export.py --season "$(date -u +%Y)"

      - name: Alert Slack on failure
        if: failure()
        uses: ./.github/actions/slack-alert
        with:
          webhook: ${{ secrets.SLACK_ALERTS_WEBHOOK }}
