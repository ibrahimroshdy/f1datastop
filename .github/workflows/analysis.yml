name: FastF1 analysis charts

# PAUSED: automated cron is disabled for now. Run manually (Actions -> Run workflow)
# or locally (analysis/README.md). Re-enable by uncommenting the schedule block.
on:
  # schedule:
  #   - cron: "0 20 * * 0"   # Sunday 20:00 UTC (after most races)
  #   - cron: "0 9 * * 1"    # Monday 09:00 UTC (catch late/US races)
  workflow_dispatch:
    inputs:
      season:
        description: "Season (year)"
        required: false
      round:
        description: "Round number (blank = latest completed)"
        required: false
      session:
        description: "Session (R, Q, S, FP1...)"
        required: false
        default: "R"

concurrency:
  group: fastf1-analysis
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache FastF1 data
        uses: actions/cache@v4
        with:
          path: analysis/.fastf1cache
          key: fastf1-cache-${{ github.run_id }}
          restore-keys: fastf1-cache-

      - name: Install dependencies
        run: pip install -r analysis/requirements.txt

      - name: Generate + upload charts
        working-directory: analysis
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FASTF1_CACHE: .fastf1cache
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.season }}" ]; then ARGS="$ARGS --season ${{ github.event.inputs.season }}"; fi
          if [ -n "${{ github.event.inputs.round }}" ]; then ARGS="$ARGS --round ${{ github.event.inputs.round }}"; fi
          if [ -n "${{ github.event.inputs.session }}" ]; then ARGS="$ARGS --session ${{ github.event.inputs.session }}"; fi
          if [ -z "${{ github.event.inputs.round }}" ]; then ARGS="$ARGS --latest"; fi
          echo "Running: python generate.py $ARGS"
          python generate.py $ARGS
