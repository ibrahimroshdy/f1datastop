name: Release

# Manual trigger only — run from Actions tab: "Run workflow" → choose version bump
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        type: choice
        required: true
        options:
          - patch
          - minor
          - major
      notes:
        description: Release notes (markdown, appended to CHANGELOG)
        type: string
        required: false

permissions:
  contents: write  # for tag push & changelog commit

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for tag push & changelog

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install deps
        run: npm ci --prefix web

      - name: Bump version
        id: version
        run: |
          cd web
          npm version ${{ github.event.inputs.bump }} --no-git-tag-version
          echo "version=$(cat package.json | jq -r .version)" >> $GITHUB_OUTPUT

      - name: Update CHANGELOG
        if: github.event.inputs.notes != ''
        run: |
          VERSION=${{ steps.version.outputs.version }}
          DATE=$(date +%Y-%m-%d)
          NOTES="${{ github.event.inputs.notes }}"
          
          # Prepend to CHANGELOG after the header
          awk -v ver="$VERSION" -v date="$DATE" -v notes="$NOTES" '
            /^## \[/ && !done { 
              print "## [" ver "] - " date
              print ""
              print notes
              print ""
              done=1
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md

      - name: Commit & Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package.json web/package-lock.json CHANGELOG.md
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin main --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}