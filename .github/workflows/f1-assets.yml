name: F1 refresh current-season assets

# Once daily (was every 6h — trimmed 2026-08-13 to cut Actions minutes; these are the
# heaviest runs at ~9 min each and the assets only change when a new round runs):
# keep the current season's durable derived assets filled — fastest-lap
# telemetry (all rounds), circuit geometry, race replays, PLUS per-lap telemetry for the
# LATEST round only (all-laps over every round would blow the minute budget; the latest
# round is the only new one, and it self-skips already-exported laps). Older seasons'
# per-lap backfill is run locally. Replaces Modal's refresh_current_assets.
#
# Failure policy: each exporter self-skips sessions a weekend doesn't have and rounds that
# haven't run, exiting 0 — so a NON-ZERO exit is a real error. We count them instead of
# swallowing with `|| true`: individual failures become warnings + a job summary, and a
# run where EVERY step failed (broken creds, bad deploy) fails the job loudly.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}

concurrency:
  group: f1-assets
  cancel-in-progress: true

jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Cloudflare R2 — all chart/telemetry/replay/circuit blobs (analysis/blob_store.py)
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      BLOB_PUBLIC_BASE: ${{ secrets.BLOB_PUBLIC_BASE }}
      # Livetiming CDN 403s Azure ranges (all GitHub runners); route via allow-listed proxy.
      F1_LIVETIMING_PROXY: ${{ secrets.F1_LIVETIMING_PROXY }}
      FASTF1_CACHE: ${{ github.workspace }}/analysis/.fastf1cache
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/f1-setup

      - name: Fail fast if Supabase creds are missing
        run: |
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY are empty — set them in repo secrets."
            exit 1
          fi

      - name: Telemetry (fastest laps) · geometry · replays — current season
        working-directory: analysis
        run: |
          set -u
          Y="$(date -u +%Y)"
          runs=0; fails=0
          # Run a step, counting outcomes. Exporters exit 0 on "skip", so non-zero == real error.
          try() {
            runs=$((runs + 1))
            if ! "$@"; then
              fails=$((fails + 1))
              echo "::warning::FAILED: $*"
            fi
          }

          # Only NEW sessions. Everything before this window is already in the warehouse
          # (historical backfill is run locally), so looping every round 1..24 just burned
          # ~400 subprocesses re-checking races that finished months ago.
          #
          # latest_completed_round() returns the last round whose RACE is done, so during a
          # live weekend it still points at the previous round — hence R and R+1:
          #   R   = the round that just finished (catches late-published data)
          #   R+1 = the weekend currently running (its FP/Q land before the race completes)
          R="$(python -c "import backfill as bf; print(bf.latest_completed_round($Y) or 0)")"
          ROUNDS=""
          [ "$R" -ge 1 ] && ROUNDS="$R"
          ROUNDS="$ROUNDS $((R + 1))"
          echo "latest completed round: $R  ->  processing rounds:$ROUNDS"

          # All session types. FP1/2/3=practice, Q=quali, SQ=sprint-quali (2024+),
          # SS=sprint-shootout (2023), S=sprint, R=race. Each exporter self-skips finished
          # sessions and no-ops on ones a weekend doesn't have — cheap either way.
          SESSIONS="FP1 FP2 FP3 Q SQ SS S R"

          for sess in $SESSIONS; do
            echo "== fastest-lap telemetry $sess =="
            for r in $ROUNDS; do try python telemetry_export.py --season "$Y" --round "$r" --session "$sess"; done
          done

          echo "== circuit geometry (session-agnostic) =="
          for r in $ROUNDS; do try python circuit_geometry_export.py --season "$Y" --round "$r"; done

          for sess in $SESSIONS; do
            echo "== race replays $sess =="
            for r in $ROUNDS; do try python race_replay_export.py --season "$Y" --round "$r" --session "$sess"; done
          done

          # Per-lap blobs only for the sessions people replay (quali, sprint, race). Practice
          # per-lap exports were ~40% of the telemetry bucket for almost no Pit Wall traffic.
          echo "== per-lap telemetry (latest round, Q/S/R only; self-skips done laps) =="
          for sess in Q SQ SS S R; do try python telemetry_export.py --season "$Y" --all-laps --latest --session "$sess"; done

          ok=$((runs - fails))
          {
            echo "### F1 assets refresh — ${Y}"
            echo ""
            echo "| steps | ok | failed |"
            echo "|------:|---:|-------:|"
            echo "| $runs | $ok | $fails |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "steps=$runs ok=$ok failed=$fails"
          if [ "$runs" -gt 0 ] && [ "$fails" -eq "$runs" ]; then
            echo "::error::every one of the $runs steps failed — treating as a broken run, not a no-op."
            exit 1
          fi
          if [ "$fails" -gt 0 ]; then
            echo "::warning::$fails of $runs steps failed (see warnings above)."
          fi
