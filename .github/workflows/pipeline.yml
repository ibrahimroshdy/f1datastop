name: Pipeline

# Data pipeline. Runs only on the main repo (github.repository guard); secrets come from repo
# Settings → Secrets. pg_cron in Supabase is the clock and starts each job through
# workflow_dispatch (supabase/migrations/20261012140000_clock_robustness.sql; the schedule table
# is checked by .github/scripts/check_schedules.py in PR CI). The single GitHub `schedule:` below
# is a once-a-day backup: it runs only the digest, which posts to Slack only when no digest
# succeeded in the last 20 h or dispatch health is bad, so a dead pg_cron/token still alerts.
on:
  schedule:
    - cron: '41 7 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        default: all
        options: [all, reconcile, charts, assets, digest]
      gate:
        description: 'Reconcile only: run only if reconcile_needed.py says so (race-weekend ticks)'
        type: boolean
        default: false
      rounds:
        description: 'Optional space-separated rounds (charts and assets only), e.g. "5 6"'
        type: string
        required: false
      rebuild_index:
        description: Rebuild CDN indexes from scratch (drops stale rows); default false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  reconcile:
    if: >-
      github.repository == 'ibrahimroshdy/f1datastop' &&
      (inputs.job == 'all' || inputs.job == 'reconcile')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pipeline-reconcile
      cancel-in-progress: false
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      BLOB_PUBLIC_BASE: ${{ secrets.BLOB_PUBLIC_BASE }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      F1_LIVETIMING_PROXY: ${{ secrets.F1_LIVETIMING_PROXY }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - run: pip install -q -r analysis/requirements.txt
      - name: Gate
        id: gate
        working-directory: analysis
        run: |
          if [ "${{ inputs.gate }}" != "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Not gated (6-hourly baseline or manual dispatch): forcing run"
            exit 0
          fi
          out="$(python reconcile_needed.py --season "$(date -u +%Y)")"
          echo "reconcile_needed: $out"
          if [ "$out" = "run" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Ingest
        if: steps.gate.outputs.run == 'true'
        working-directory: analysis
        run: python ingest.py --season "$(date -u +%Y)"
      - name: Export data
        if: steps.gate.outputs.run == 'true'
        working-directory: analysis
        run: python data_export.py --season "$(date -u +%Y)"
      - name: Refresh CDN indexes
        if: always() && steps.gate.outputs.run == 'true'
        working-directory: analysis
        run: python index_export.py --season "$(date -u +%Y)" ${{ inputs.rebuild_index && '--rebuild' || '' }}

  charts:
    if: >-
      github.repository == 'ibrahimroshdy/f1datastop' &&
      (inputs.job == 'all' || inputs.job == 'charts')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: pipeline-charts
      cancel-in-progress: false
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      BLOB_PUBLIC_BASE: ${{ secrets.BLOB_PUBLIC_BASE }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      F1_LIVETIMING_PROXY: ${{ secrets.F1_LIVETIMING_PROXY }}
      ROUNDS_FILTER: ${{ inputs.rounds }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - run: pip install -q -r analysis/requirements.txt
      - name: Find sessions needing charts
        working-directory: analysis
        run: |
          Y="$(date -u +%Y)"
          python charts_todo.py --season "$Y" > todo.txt
          if [ -n "$ROUNDS_FILTER" ]; then
            for r in $ROUNDS_FILTER; do awk -v r="$r" '$1==r' todo.txt; done > todo.filtered
            mv todo.filtered todo.txt
          fi
          if [ -s todo.txt ]; then echo "Sessions needing charts:"; cat todo.txt; else echo "All charts complete"; fi
      - name: Generate charts
        working-directory: analysis
        run: |
          Y="$(date -u +%Y)"
          ok=0; skipped=0; fails=0
          summary() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          try() {
            set +e; "$@"; rc=$?; set -e
            if [ "$rc" -eq 0 ]; then ok=$((ok + 1))
            elif [ "$rc" -eq 2 ]; then skipped=$((skipped + 1)); echo "SKIPPED (session data not yet available): $*"
            else fails=$((fails + 1)); echo "FAILED (exit $rc): $*"; summary "- FAILED (exit $rc): \`$*\`"; fi
          }
          echo "### Charts" >> "$GITHUB_STEP_SUMMARY"
          while read -r r sess; do
            [ -n "$r" ] || continue
            echo "== charts R$r $sess =="
            try python generate.py --season "$Y" --round "$r" --session "$sess" \
                --format landscape --theme all --skip-existing </dev/null
          done < todo.txt
          for r in $(awk '$2=="R"{print $1}' todo.txt | sort -u); do
            for pair in "RUS,ANT" "NOR,PIA" "LEC,HAM"; do
              try python generate.py --season "$Y" --round "$r" --session R \
                  --only driver_compare --drivers "$pair" --format landscape --theme all --skip-existing
            done
          done
          summary "calls ok=$ok skipped=$skipped failed=$fails"
          [ "$fails" -eq 0 ]
      - name: Refresh CDN indexes
        if: always()
        working-directory: analysis
        run: python index_export.py --season "$(date -u +%Y)" ${{ inputs.rebuild_index && '--rebuild' || '' }}

  assets:
    if: >-
      github.repository == 'ibrahimroshdy/f1datastop' &&
      (inputs.job == 'all' || inputs.job == 'assets')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: pipeline-assets
      cancel-in-progress: false
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      BLOB_PUBLIC_BASE: ${{ secrets.BLOB_PUBLIC_BASE }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      F1_LIVETIMING_PROXY: ${{ secrets.F1_LIVETIMING_PROXY }}
      ROUNDS_OVERRIDE: ${{ inputs.rounds }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - run: pip install -q -r analysis/requirements.txt
      - name: Export telemetry, geometry, weather, replays
        working-directory: analysis
        run: |
          Y="$(date -u +%Y)"
          if [ -n "$ROUNDS_OVERRIDE" ]; then
            ROUNDS="$ROUNDS_OVERRIDE"
            echo "rounds override: $ROUNDS"
          else
            R="$(python -c "import backfill; print(backfill.latest_completed_round($Y) or 0)")"
            ROUNDS=""
            [ "$R" -ge 1 ] && ROUNDS="$R"
            ROUNDS="$ROUNDS $((R + 1))"
            echo "latest completed round: $R -> processing rounds:$ROUNDS"
          fi
          SESSIONS="FP1 FP2 FP3 Q SQ SS S R"
          runs=0; fails=0
          try() { runs=$((runs + 1)); if ! "$@"; then fails=$((fails + 1)); echo "FAILED: $*"; echo "- FAILED: \`$*\`" >> "$GITHUB_STEP_SUMMARY"; fi; }
          for sess in $SESSIONS; do
            for r in $ROUNDS; do try python telemetry_export.py --season "$Y" --round "$r" --session "$sess"; done
          done
          for r in $ROUNDS; do try python circuit_geometry_export.py --season "$Y" --round "$r"; done
          for r in $ROUNDS; do try python weather_export.py --season "$Y" --round "$r"; done
          for sess in $SESSIONS; do
            for r in $ROUNDS; do try python race_replay_export.py --season "$Y" --round "$r" --session "$sess"; done
          done
          for sess in Q SQ SS S R; do try python telemetry_export.py --season "$Y" --all-laps --latest --session "$sess"; done
          echo "steps=$runs ok=$((runs - fails)) failed=$fails" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$fails" -eq 0 ]
      - name: Refresh CDN indexes
        if: always()
        working-directory: analysis
        run: python index_export.py --season "$(date -u +%Y)" ${{ inputs.rebuild_index && '--rebuild' || '' }}

  digest:
    if: >-
      github.repository == 'ibrahimroshdy/f1datastop' &&
      (inputs.job == 'all' || inputs.job == 'digest' || github.event.schedule == '41 7 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pipeline-digest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - run: pip install -q -r analysis/requirements.txt
      - run: python free_tier_digest.py
        working-directory: analysis
        env:
          SLACK_ALERTS_WEBHOOK: ${{ secrets.SLACK_ALERTS_WEBHOOK }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BLOB_PUBLIC_BASE: ${{ secrets.BLOB_PUBLIC_BASE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_REPO: ibrahimroshdy/f1datastop
          DIGEST_MODE: ${{ github.event_name == 'schedule' && 'backup' || 'normal' }}
          # GITHUB_TOKEN is auto-provisioned; the workflow grants actions:read.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
