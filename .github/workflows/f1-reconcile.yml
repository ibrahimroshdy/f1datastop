name: F1 reconcile current season

# ingest.py reconciles the current season into the warehouse. It skips rounds that already
# hold authoritative results, so a whole-season pass only loads FastF1 for new rounds, and
# for rounds still marked provisional (ingested from live timing before Ergast published,
# which the pass keeps retrying until real data replaces it).
#
# Two cadences: every 6h as the baseline, plus every 30 minutes during race-day hours.
# A race that finishes just after a baseline tick would otherwise leave the site showing
# pre-race standings — exactly when traffic peaks. Sessions run Fri-Sun, so the tight
# window is scoped to those days and the hours races actually fall in (12-21).
# (Trimmed 2026-08-13 to cut Actions minutes: was 2h baseline + every-20min all weekend.)
on:
  schedule:
    - cron: "0 */6 * * *"
    - cron: "*/30 12-21 * * 5,6,0"
  workflow_dispatch: {}

concurrency:
  group: f1-reconcile
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Livetiming CDN 403s Azure ranges (all GitHub runners); route via allow-listed proxy.
      F1_LIVETIMING_PROXY: ${{ secrets.F1_LIVETIMING_PROXY }}
      FASTF1_CACHE: ${{ github.workspace }}/analysis/.fastf1cache
    steps:
      - uses: actions/checkout@v4

      # The 30-minute race-day cron only pays for setup when a session actually started in
      # the last 8 h (analysis/reconcile_needed.py, stdlib, ~5 s). The 6-hourly baseline and
      # manual runs are unconditional so late-published Ergast data is always picked up.
      - name: Is there a live/just-finished session?
        id: gate
        working-directory: analysis
        run: |
          if [ "${{ github.event.schedule }}" = "*/30 12-21 * * 5,6,0" ]; then
            out="$(python3 reconcile_needed.py --season "$(date -u +%Y)")"; echo "$out"
            case "$out" in run*) echo "go=true" >> "$GITHUB_OUTPUT";; *) echo "go=false" >> "$GITHUB_OUTPUT"; echo "No session in the window — skipping this tick.";; esac
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/f1-setup
        if: steps.gate.outputs.go == 'true'
      - name: Ingest current season (skips finished rounds)
        if: steps.gate.outputs.go == 'true'
        working-directory: analysis
        run: python ingest.py --season "$(date -u +%Y)"
