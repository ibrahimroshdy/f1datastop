name: F1 reconcile current season

# ingest.py reconciles the current season into the warehouse. It skips rounds that already
# hold authoritative results, so a whole-season pass only loads FastF1 for new rounds, and
# for rounds still marked provisional (ingested from live timing before Ergast published,
# which the pass keeps retrying until real data replaces it).
#
# Two cadences: every 6h as the baseline, plus every 30 minutes during race-day hours.
# A race that finishes just after a baseline tick would otherwise leave the site showing
# pre-race standings — exactly when traffic peaks. Sessions run Fri-Sun, so the tight
# window is scoped to those days and the hours races actually fall in (12-21).
# (Trimmed 2026-08-13 to cut Actions minutes: was 2h baseline + every-20min all weekend.)
on:
  schedule:
    - cron: "0 */6 * * *"
    - cron: "*/30 12-21 * * 5,6,0"
  workflow_dispatch: {}

concurrency:
  group: f1-reconcile
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Cloudflare R2 — static season JSON exported after ingest (analysis/data_export.py)
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      BLOB_PUBLIC_BASE: ${{ secrets.BLOB_PUBLIC_BASE }}
      # Livetiming CDN 403s Azure ranges (all GitHub runners); route via allow-listed proxy.
      F1_LIVETIMING_PROXY: ${{ secrets.F1_LIVETIMING_PROXY }}
      FASTF1_CACHE: ${{ github.workspace }}/analysis/.fastf1cache
    steps:
      - uses: actions/checkout@v4

      # The 30-minute race-day cron only pays for setup when a session actually started in
      # the last 8 h (analysis/reconcile_needed.py, stdlib, ~5 s). The 6-hourly baseline and
      # manual runs are unconditional so late-published Ergast data is always picked up.
      - name: Is there a live/just-finished session?
        id: gate
        working-directory: analysis
        run: |
          if [ "${{ github.event.schedule }}" = "*/30 12-21 * * 5,6,0" ]; then
            out="$(python3 reconcile_needed.py --season "$(date -u +%Y)")"; echo "$out"
            case "$out" in run*) echo "go=true" >> "$GITHUB_OUTPUT";; *) echo "go=false" >> "$GITHUB_OUTPUT"; echo "No session in the window — skipping this tick.";; esac
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      # Ingest writes to Postgres, so it can do nothing while the Supabase project is
      # restricted (402 on every request — Free-plan quota breach). Skip it cleanly
      # instead of failing (and paging Slack) on every cron tick. The EXPORT still runs:
      # data_export.py falls back to Jolpica, so results and standings on the CDN stay
      # current through the outage. The daily free-tier digest reports the restriction.
      - name: Is Supabase serving?
        id: supabase
        if: steps.gate.outputs.go == 'true'
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" "$SUPABASE_URL/rest/v1/")"
          echo "supabase REST -> HTTP $code"
          if [ "$code" = "402" ]; then
            echo "up=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Supabase project is restricted (402) — skipping ingest until the quota resets."
            echo "### Reconcile skipped — Supabase restricted (402)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "up=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/f1-setup
        if: steps.gate.outputs.go == 'true'
      - name: Ingest current season (skips finished rounds)
        if: steps.gate.outputs.go == 'true' && steps.supabase.outputs.up == 'true'
        working-directory: analysis
        run: python ingest.py --season "$(date -u +%Y)"

      # Snapshot the serving RPCs (schedule / standings / per-round results) to static JSON
      # on R2 so the site reads cdn.f1datastop.com instead of hitting Postgres ~100k times a
      # month. Runs after every ingest so the files track the warehouse; the frontend falls
      # back to the RPC on a 404.
      - name: Export season JSON to R2
        if: steps.gate.outputs.go == 'true'
        working-directory: analysis
        run: python data_export.py --season "$(date -u +%Y)" --source auto

      - name: Alert Slack on failure
        if: failure()
        uses: ./.github/actions/slack-alert
        with:
          webhook: ${{ secrets.SLACK_ALERTS_WEBHOOK }}
