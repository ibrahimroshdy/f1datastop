name: F1 reconcile current season

# ingest.py reconciles the current season into the warehouse. It skips rounds that already
# hold authoritative results, so a whole-season pass only loads FastF1 for new rounds, and
# for rounds still marked provisional (ingested from live timing before Ergast published,
# which the pass keeps retrying until real data replaces it).
#
# Two cadences: every 2h as the baseline, plus every 20 minutes on race day. A race that
# finishes just after a 2-hourly tick would otherwise leave the site showing pre-race
# standings for nearly two hours — exactly when traffic peaks. Sessions run Fri-Sun, so
# the tight window is scoped to those days and to the hours races actually fall in.
on:
  schedule:
    - cron: "0 */2 * * *"
    - cron: "*/20 10-23 * * 5,6,0"
  workflow_dispatch: {}

concurrency:
  group: f1-reconcile
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Livetiming CDN 403s Azure ranges (all GitHub runners); route via allow-listed proxy.
      F1_LIVETIMING_PROXY: ${{ secrets.F1_LIVETIMING_PROXY }}
      FASTF1_CACHE: ${{ github.workspace }}/analysis/.fastf1cache
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/f1-setup
      - name: Ingest current season (skips finished rounds)
        working-directory: analysis
        run: python ingest.py --season "$(date -u +%Y)"
