name: Free-tier digest

# Daily Slack digest of every limit that could ever bill (R2, Supabase DB, Actions minutes),
# with warnings at 70 % / 90 %. Deliberately tiny: no FastF1 setup, ~20 s, ~10 min/month.
# SCHEDULING MOVED TO CIRCLECI (.circleci/config.yml) on 2026-09-13: the GitHub account's
# 3,000 included Actions minutes were exhausted on 2026-09-12 by other repos, and every run
# here failed in ~1 s. The cron trigger is removed so the two schedulers never double-run;
# workflow_dispatch is kept so this can still be run by hand from the Actions tab.
on:
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      BLOB_PUBLIC_BASE: ${{ secrets.BLOB_PUBLIC_BASE }}
      SLACK_ALERTS_WEBHOOK: ${{ secrets.SLACK_ALERTS_WEBHOOK }}
      GH_BILLING_TOKEN: ${{ secrets.GH_BILLING_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q boto3 requests
      - name: Post digest
        working-directory: analysis
        run: python free_tier_digest.py
      - name: Alert Slack on failure
        if: failure()
        uses: ./.github/actions/slack-alert
        with:
          webhook: ${{ secrets.SLACK_ALERTS_WEBHOOK }}
