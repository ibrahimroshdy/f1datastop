name: Slack alert
description: Post a failure alert for the current workflow run to the #f1-alerts webhook.
inputs:
  webhook:
    description: Slack incoming-webhook URL (secrets.SLACK_ALERTS_WEBHOOK)
    required: true
  title:
    description: Short label for the job (defaults to the workflow name)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        WEBHOOK: ${{ inputs.webhook }}
        TITLE: ${{ inputs.title }}
      run: |
        [ -n "$WEBHOOK" ] || { echo "no SLACK_ALERTS_WEBHOOK secret — skipping alert"; exit 0; }
        name="${TITLE:-${{ github.workflow }}}"
        url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        payload=$(python3 - "$name" "$url" <<'PY'
        import json, sys
        name, url = sys.argv[1], sys.argv[2]
        print(json.dumps({"text": f":rotating_light: *{name}* failed on `${{ github.ref_name }}` (${{ github.event_name }}) — <{url}|open run>"}))
        PY
        )
        curl -s -X POST "$WEBHOOK" -H "Content-type: application/json" -d "$payload" >/dev/null || true
