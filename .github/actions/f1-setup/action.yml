name: F1 analysis setup
description: Python + FastF1 deps + fonts + a restored FastF1 cache for the analysis scripts.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: analysis/requirements.txt
    - name: System fonts (matplotlib brand fonts)
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq fontconfig
    - name: Install Python deps
      shell: bash
      run: pip install -r analysis/requirements.txt
    - name: Restore FastF1 session cache
      uses: actions/cache@v4
      with:
        path: analysis/.fastf1cache
        key: fastf1-cache-${{ github.run_id }}
        restore-keys: |
          fastf1-cache-
