<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="F1 DataStop — Timing, telemetry, charts and standings.">
  <title>F1 DataStop</title>
  <!-- Mark: root logo.svg artwork pasted verbatim (gradient ids suffixed for
       self-containment). Locked — do not recolor or reshape. -->
  <g transform="translate(260,12)">
    <svg width="120" height="120" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="heroR" cx="38%" cy="30%" r="80%">
          <stop offset="0" stop-color="#FF2A12"/>
          <stop offset="1" stop-color="#C10000"/>
        </radialGradient>
        <linearGradient id="heroBand" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#161616"/>
          <stop offset="1" stop-color="#3a3a3a"/>
        </linearGradient>
      </defs>
      <circle cx="80" cy="80" r="80" fill="url(#heroR)"/>
      <circle cx="80" cy="80" r="75.5" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
      <path d="M40 60C40 60 65 50 80 50C95 50 120 60 120 60L130 80C130 80 105 70 80 70C55 70 30 80 30 80L40 60Z" fill="#0d0d0d"/>
      <path d="M30 80C30 80 55 70 80 70C105 70 130 80 130 80L120 100C120 100 95 90 80 90C65 90 40 100 40 100L30 80Z" fill="url(#heroBand)"/>
      <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M50 63L55 97"/>
        <path d="M110 63L105 97"/>
        <path d="M75 53L80 107"/>
        <path d="M85 53L80 107"/>
      </g>
    </svg>
  </g>
  <!-- Wordmark in the single red accent so it reads on light and dark
       README themes without a backdrop box. -->
  <text x="320" y="196" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="800" font-size="46" letter-spacing="-1" fill="#E10600">F1 DataStop</text>
  <text x="320" y="228" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="400" font-size="17" fill="#737373">Timing, telemetry, charts &amp; standings.</text>
  <!-- Flat-square mono badges: red wash lead, hairline-bordered chips. -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-weight="700" font-size="15">
    <rect x="110" y="252" width="84" height="36" fill="#E10600"/>
    <text x="152" y="276" text-anchor="middle" fill="#ffffff">TIMING</text>
    <rect x="204" y="252" width="111" height="36" fill="none" stroke="#737373" stroke-width="1.5"/>
    <text x="259.5" y="276" text-anchor="middle" fill="#737373">TELEMETRY</text>
    <rect x="325" y="252" width="84" height="36" fill="none" stroke="#737373" stroke-width="1.5"/>
    <text x="367" y="276" text-anchor="middle" fill="#737373">CHARTS</text>
    <rect x="419" y="252" width="111" height="36" fill="none" stroke="#737373" stroke-width="1.5"/>
    <text x="474.5" y="276" text-anchor="middle" fill="#737373">STANDINGS</text>
  </g>
</svg>
